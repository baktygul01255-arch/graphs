<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>Кеңістіктегі бұрыштар</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&display=swap">
<style>
/* Layout: school-notebook sheet on graph paper. Sticky header, pill tabs, one card per topic
   (text left, rotatable 3D figure right), reference grid, floating pen toolbar over an ink layer. */
:root{
  --u:1.25; --k:1.15; --ul:1.12;
  --paper:#f6f8fd; --grid:#dde5f4; --surface:#ffffff; --surface-2:#eef3fc;
  --ink:#142040; --ink-2:#4b5979; --rule:#ccd6ea;
  --accent:#2447c5; --accent-ink:#ffffff; --accent-soft:rgba(36,71,197,.12);
  --margin:#d63e4f;
  --plane-a:rgba(36,71,197,.17); --edge-a:#2447c5;
  --plane-b:rgba(214,62,79,.17); --edge-b:#d63e4f;
  --plane-c:rgba(17,122,85,.17); --edge-c:#117a55;
  --good:#117a55; --good-soft:rgba(17,122,85,.12); --bad:#c2303f; --bad-soft:rgba(194,48,63,.11);
  --pen-1:#1b3fd0; --pen-2:#d3263f; --pen-3:#0f8a5f;
  --font-display:'Source Serif 4','Noto Serif',Georgia,serif;
  --font-ui:'IBM Plex Sans','Noto Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0e1526; --grid:#1a2742; --surface:#141d33; --surface-2:#1a2542;
    --ink:#e8eefc; --ink-2:#a2b2d4; --rule:#2b3b60;
    --accent:#86a6ff; --accent-ink:#0e1526; --accent-soft:rgba(134,166,255,.17);
    --margin:#ff8591;
    --plane-a:rgba(134,166,255,.20); --edge-a:#86a6ff;
    --plane-b:rgba(255,133,145,.20); --edge-b:#ff8591;
    --plane-c:rgba(95,211,161,.20); --edge-c:#5fd3a1;
    --good:#5fd3a1; --good-soft:rgba(95,211,161,.14); --bad:#ff8591; --bad-soft:rgba(255,133,145,.13);
    --pen-1:#8fb0ff; --pen-2:#ff8a98; --pen-3:#5fd3a1;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0e1526; --grid:#1a2742; --surface:#141d33; --surface-2:#1a2542;
  --ink:#e8eefc; --ink-2:#a2b2d4; --rule:#2b3b60;
  --accent:#86a6ff; --accent-ink:#0e1526; --accent-soft:rgba(134,166,255,.17);
  --margin:#ff8591;
  --plane-a:rgba(134,166,255,.20); --edge-a:#86a6ff;
  --plane-b:rgba(255,133,145,.20); --edge-b:#ff8591;
  --plane-c:rgba(95,211,161,.20); --edge-c:#5fd3a1;
  --good:#5fd3a1; --good-soft:rgba(95,211,161,.14); --bad:#ff8591; --bad-soft:rgba(255,133,145,.13);
  --pen-1:#8fb0ff; --pen-2:#ff8a98; --pen-3:#5fd3a1;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink); font:400 calc(16px*var(--u))/1.5 var(--font-ui); -webkit-text-size-adjust:100%;
}
button,input{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{width:100%;max-width:calc(1080px*var(--u));margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{padding-block:0 110px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{flex-wrap:wrap;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand-txt{min-width:0}
.brand-t{font:600 calc(21px*var(--ul))/1.1 var(--font-display);letter-spacing:-.01em;white-space:nowrap}
.brand-s{font-size:calc(12.5px*var(--u));color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrl{flex-wrap:wrap;display:flex;align-items:center;gap:8px;flex:none}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--ink-2);font:600 calc(13px*var(--u)) var(--font-ui);padding:0 11px;min-height:calc(38px*var(--k));cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.icon-btn{width:calc(38px*var(--k));height:calc(38px*var(--k));display:grid;place-items:center;border:1px solid var(--rule);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer}
.icon-btn svg,.tool svg{display:block}

/* tabs */
.tabs{display:flex;gap:8px;padding-block:14px 4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--rule);background:var(--surface);color:var(--ink-2);font:600 calc(15px*var(--u)) var(--font-ui);padding:0 16px;min-height:calc(42px*var(--k));border-radius:999px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* sheet */
.sheet{position:relative}
.stack{display:grid;gap:16px;padding-block:12px 24px}
.intro{margin:6px 0 0;max-width:64ch;color:var(--ink-2);font-size:calc(15.5px*var(--u))}
.src-note{margin:0;font-size:calc(12.5px*var(--u));color:var(--ink-2)}
.legend{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:0 14px}
.legend summary{cursor:pointer;font-weight:600;min-height:calc(46px*var(--k));display:flex;align-items:center}
.legend-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 18px;padding:2px 0 14px;margin:0;list-style:none}
.legend-g li{display:flex;gap:10px;align-items:baseline;min-width:0}
.legend-g b{font:italic 600 calc(17px*var(--u)) var(--font-display);white-space:nowrap;min-width:5.4em}
.legend-g span{font-size:calc(14px*var(--u));color:var(--ink-2)}

.card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:820px){.card{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);padding:24px;gap:30px}}
.c-text{display:flex;flex-direction:column;gap:14px;min-width:0}
.c-head{display:flex;align-items:center;gap:10px}
.tag{flex:none;background:var(--accent);color:var(--accent-ink);font:700 calc(14px*var(--u)) var(--font-ui);letter-spacing:.03em;padding:4px 10px;border-radius:8px;white-space:nowrap}
.c-head h2{margin:0;font:600 calc(22px*var(--u))/1.2 var(--font-display);text-wrap:balance}
.stmt{margin:0;font:400 calc(19px*var(--u))/1.5 var(--font-display);max-width:58ch}
.defs{margin:0;padding-left:1.2em;display:grid;gap:4px;font-size:calc(15px*var(--u));color:var(--ink-2);max-width:60ch}
.sym{margin:0;background:var(--surface-2);border-radius:10px;padding:10px 12px;font:italic 400 calc(17px*var(--u))/1.5 var(--font-display);overflow-wrap:anywhere}
.sym small{display:block;font:600 calc(11px*var(--u)) var(--font-ui);font-style:normal;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);margin-bottom:2px}
.real{border-top:1px dashed var(--rule);padding-top:12px}
.real small{font:600 calc(11px*var(--u)) var(--font-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--margin)}
.real p{margin:2px 0 0;font-size:calc(15px*var(--u));color:var(--ink-2);max-width:58ch}
.extra{margin:0;border-top:1px dashed var(--rule);padding-top:12px;font-size:calc(15px*var(--u));max-width:60ch}
.extra b{font-weight:600}
.proof{border-top:1px dashed var(--rule);padding-top:4px}
.proof summary{cursor:pointer;font-weight:600;min-height:calc(44px*var(--k));display:flex;align-items:center}
.proof ol{margin:0;padding-left:1.3em;display:grid;gap:8px;font-size:calc(15.5px*var(--u));max-width:60ch}
.proof li::marker{font-weight:600;color:var(--ink-2)}
.ref{display:inline-block;font:700 calc(12px*var(--u)) var(--font-ui);background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:0 6px;margin-left:4px;white-space:nowrap}

/* figure */
.c-fig{min-width:0}
.fig{margin:0;background:var(--surface-2);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.fig svg{display:block;width:100%;height:auto;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.fig svg.grab{cursor:grabbing}
.fig figcaption{padding:10px 14px;border-top:1px solid var(--rule);font-size:calc(14.5px*var(--u));line-height:1.45;color:var(--ink-2);min-height:5.2em}
.counts{display:flex;gap:8px;margin-top:10px}
.count{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--rule);border-radius:10px;padding:6px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.count span{font-size:calc(12.5px*var(--u));color:var(--ink-2);min-width:0;overflow-wrap:anywhere}
.count b{font:600 calc(22px*var(--u)) var(--font-display);font-variant-numeric:tabular-nums}
.modes{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mode{border:1px solid var(--rule);background:var(--surface);color:var(--ink-2);font:600 calc(13.5px*var(--u)) var(--font-ui);border-radius:999px;padding:0 14px;min-height:calc(38px*var(--k));cursor:pointer}
.mode[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.slider{display:flex;align-items:center;gap:12px;margin-top:10px;font-weight:600;font-size:calc(14px*var(--u))}
.slider span{white-space:nowrap;min-width:4.2em;font-variant-numeric:tabular-nums}
.slider input{flex:1;min-width:0;accent-color:var(--accent);min-height:calc(30px*var(--k))}
.fig-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px;font-size:calc(12.5px*var(--u));color:var(--ink-2)}
.link-btn{border:0;background:transparent;color:var(--accent);font:600 calc(13px*var(--u)) var(--font-ui);cursor:pointer;min-height:calc(36px*var(--k));padding:0 4px}
.pl-a{fill:var(--plane-a);stroke:var(--edge-a);stroke-width:1.5;stroke-linejoin:round}
.pl-b{fill:var(--plane-b);stroke:var(--edge-b);stroke-width:1.5;stroke-linejoin:round}
.pl-c{fill:var(--plane-c);stroke:var(--edge-c);stroke-width:1.5;stroke-linejoin:round}
.pl-f{fill:var(--plane-a);stroke:none}
.ln{fill:none;stroke-linecap:round}
.ln-ink{stroke:var(--ink)} .ln-accent{stroke:var(--accent)} .ln-faint{stroke:var(--ink-2)}
.pt{fill:var(--ink);stroke:var(--surface-2);stroke-width:2}
.lbl{font:italic 600 calc(18px*var(--ul)) var(--font-display);fill:var(--ink);text-anchor:middle;dominant-baseline:middle;paint-order:stroke;stroke:var(--surface-2);stroke-width:3px}
.lbl-h{fill:var(--ink-2)}
.lbl-a{fill:var(--edge-a)} .lbl-b{fill:var(--edge-b)} .lbl-c{fill:var(--edge-c)} .lbl-ln{fill:var(--accent)}
.lbl-pl{font-size:calc(21px*var(--ul))}

/* reference */
.ref-tools{display:grid;gap:10px}
.search{width:100%;min-height:calc(46px*var(--k));border:1px solid var(--rule);border-radius:12px;background:var(--surface);color:var(--ink);font:500 calc(16px*var(--u)) var(--font-ui);padding:0 14px}
.search::placeholder{color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.rgroup{display:grid;gap:10px}
.rgroup h3{margin:6px 0 0;font:600 calc(13px*var(--u)) var(--font-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.ref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.rc{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.rc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.symbtn{border:1px solid var(--rule);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:4px 12px;min-height:calc(44px*var(--k));max-width:100%;font:italic 600 calc(24px*var(--u))/1.2 var(--font-display);cursor:pointer;text-align:left;overflow-wrap:anywhere}
.symbtn:hover{border-color:var(--accent)}
.rc-term{font:600 calc(20px*var(--u))/1.25 var(--font-display)}
.rc-src{flex:none;font:700 calc(12px*var(--u)) var(--font-ui);color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:2px 7px;white-space:nowrap}
.rc-txt{margin:0;font-size:calc(15px*var(--u))}
.rc-ex{margin:0;font:italic calc(15.5px*var(--u)) var(--font-display);color:var(--ink-2);overflow-wrap:anywhere}
.rc-alt{margin:0;font-size:calc(13.5px*var(--u));color:var(--ink-2)}
.empty{padding:28px 12px;text-align:center;color:var(--ink-2)}

/* quiz */
.quiz{max-width:720px;grid-template-columns:minmax(0,1fr)!important;gap:16px}
.prog{display:flex;gap:4px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--rule)}
.prog i.on{background:var(--accent)}
.q-n{font-size:calc(13px*var(--u));color:var(--ink-2);font-weight:600}
.q-t{margin:0;font:600 calc(21px*var(--ul))/1.35 var(--font-display);text-wrap:balance}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border:1px solid var(--rule);border-radius:12px;background:var(--surface);color:var(--ink);font:500 calc(16px*var(--u))/1.4 var(--font-ui);cursor:pointer;min-height:calc(50px*var(--k))}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--rule);display:grid;place-items:center;font-size:calc(12px*var(--u));font-weight:700;color:var(--ink-2)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{margin:0;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:calc(15px*var(--u))}
.fb b.ok{color:var(--good)} .fb b.bad{color:var(--bad)}
.btn{align-self:flex-start;border:0;background:var(--accent);color:var(--accent-ink);font:600 calc(15px*var(--u)) var(--font-ui);padding:0 20px;min-height:calc(46px*var(--k));border-radius:12px;cursor:pointer}
.score{font:600 calc(40px*var(--u))/1 var(--font-display)}

/* pen */
#ink{position:absolute;left:0;top:0;z-index:5;pointer-events:none}
body[data-tool="pen"] #ink,body[data-tool="eraser"] #ink{pointer-events:auto;touch-action:none;cursor:crosshair}
body[data-tool="eraser"] #ink{cursor:cell}
.pen{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.pen-bar{pointer-events:auto;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px;padding:6px;background:var(--surface);border:1px solid var(--rule);border-radius:16px;box-shadow:0 8px 28px rgba(8,16,40,.22)}
.tool{width:calc(38px*var(--k));height:calc(38px*var(--k));display:grid;place-items:center;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--ink);cursor:pointer;padding:0}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tool.armed{background:var(--bad);color:#fff}
.tool .dot{display:block;border-radius:50%;background:currentColor}
.tool.sw .dot{width:20px;height:20px}
.tool.sw[aria-pressed="true"]{background:transparent;border-color:var(--ink)}
.sep{width:1px;height:24px;background:var(--rule);margin:0 3px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:45;max-width:min(92vw,420px);background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:12px;font-size:calc(14px*var(--u));line-height:1.35;text-align:center;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

.ang-f{fill:var(--plane-b);stroke:none}
.ang-s{fill:none;stroke:var(--edge-b);stroke-width:1.9;stroke-linejoin:round;stroke-linecap:round}
.ln-b{stroke:var(--edge-b)} .ln-c{stroke:var(--edge-c)}
.lbl-ang{font-size:calc(17px*var(--ul))}
.c-head h2,.c-text,.stmt,.defs li,.sym{min-width:0;overflow-wrap:break-word;hyphens:auto}
</style>

/* ---------- 3D helpers ---------- */
function planeAround(th,hx,hs){var s=Math.sin(th),c=Math.cos(th);return [[-hx,-hs*s,-hs*c],[hx,-hs*s,-hs*c],[hx,hs*s,hs*c],[-hx,hs*s,hs*c]];}
function yShift(pts,dy){return pts.map(function(p){return [p[0],p[1]+dy,p[2]];});}
function lerp(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function pl(pts,col,lab,li){return {k:'plane',pts:pts,col:col,lab:lab,li:li};}
function ln(a,b,o){var r={k:'line',a:a,b:b,c:'ink',w:2,le:'b',lo:[8,-10]};for(var k in o)r[k]=o[k];return r;}
function pt(p,lab,o){var r={k:'pt',p:p,lab:lab,o:[9,-9]};for(var k in o)r[k]=o[k];return r;}
var PH=planeAround(0,1.25,.95);
var LET='ABCDEFGH';

/* polyhedra */
function ngon(n,r,y,rot){var a=[],k,t;for(k=0;k<n;k++){t=rot+2*Math.PI*k/n;a.push([r*Math.cos(t),y,r*Math.sin(t)]);}return a;}
function poly(V,F,names){return {k:'poly',V:V,F:F,names:names};}
function boxPoly(hx,hy,hz,sx,sz){
 var b=[[-hx,-hy,hz],[hx,-hy,hz],[hx,-hy,-hz],[-hx,-hy,-hz]],
     t=b.map(function(q){return [q[0]+sx,hy,q[2]+sz];});
 return poly(b.concat(t),[[0,1,2,3],[4,5,6,7],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]],
  ['A','B','C','D','A'+SUB,'B'+SUB,'C'+SUB,'D'+SUB]);
}
function tetraPoly(){
 return poly([[-.75,-.6,.43],[.75,-.6,.43],[0,-.6,-.87],[0,.62,0]],[[0,1,2],[0,1,3],[1,2,3],[2,0,3]],['A','B','C','D']);
}
function prismPoly(n,obl){
 var rot=Math.PI*.75,b=ngon(n,.85,-.65,rot),t=ngon(n,.85,.65,rot).map(function(q){return obl?[q[0]+.5,q[1],q[2]-.25]:q;}),
     F=[[],[]],names=[],i,j;
 for(i=0;i<n;i++){F[0].push(i);F[1].push(n+i);names.push(LET[i]);}
 for(i=0;i<n;i++)names.push(LET[i]+SUB);
 for(i=0;i<n;i++){j=(i+1)%n;F.push([i,j,n+j,n+i]);}
 return poly(b.concat(t),F,names);
}
function pyramidPoly(n){
 var b=ngon(n,.95,-.6,Math.PI*.75),F=[[]],names=[],i,j;
 for(i=0;i<n;i++){F[0].push(i);names.push(LET[i]);}
 for(i=0;i<n;i++){j=(i+1)%n;F.push([i,j,n]);}
 names.push('S');
 return poly(b.concat([[0,.85,0]]),F,names);
}
function polyCounts(p){
 var seen={},e=0;
 p.F.forEach(function(f){for(var i=0;i<f.length;i++){var a=f[i],b=f[(i+1)%f.length],k=a<b?a+'-'+b:b+'-'+a;if(!seen[k]){seen[k]=1;e++;}}});
 return [p.V.length,e,p.F.length];
}

/* ---------- vector helpers and angle marks ---------- */
function vadd(a,b){return [a[0]+b[0],a[1]+b[1],a[2]+b[2]];}
function vsub(a,b){return [a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
function vmul(a,k){return [a[0]*k,a[1]*k,a[2]*k];}
function vdot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
function vcross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
function vlen(a){return Math.sqrt(vdot(a,a));}
function vunit(a){var l=vlen(a)||1;return vmul(a,1/l);}
function angDeg(a,b){var c=vdot(a,b)/(vlen(a)*vlen(b));return Math.acos(Math.max(-1,Math.min(1,c)))/D;}
function fmtN(x,d){return String(+x.toFixed(d)).replace('.',',');}
function ang(o,u,w,opt){var r={k:'ang',o:o,u:vunit(u),w:vunit(w),r:.3,sq:false,lab:'',col:'b'};for(var k in opt)r[k]=opt[k];return r;}
function rightAt(o,u,w,r){return ang(o,u,w,{sq:true,r:r||.16});}
function dashed(a,b,c){return ln(a,b,{c:c||'faint',d:1,w:1.6});}

       kk:'Кубтың AC₁ және BD₁ диагональдары центрде қиылысады. Бірлік куб үшін cos φ = 1/3, сондықтан φ ≈ 70,5°.'}},
 {id:'m4',a:[0,7],b:[3,1],P:7,tr:true,ru:'AD₁ и BD',kk:'AD₁ және BD',
  cap:{ru:'AD₁ и BD скрещиваются. BD ∥ B₁D₁, поэтому ищем угол AD₁B₁. Треугольник AD₁B₁ равносторонний (диагонали граней), угол равен 60°.',
       kk:'AD₁ және BD айқас. BD ∥ B₁D₁, сондықтан AD₁B₁ бұрышын іздейміз. AD₁B₁ үшбұрышы тең қабырғалы (жақтардың диагональдары), бұрыш 60°.'}}
];
function cubeAngle(m){
 var P=cubeP(),V=P.V,Pt=m.P==='c'?[0,0,0]:V[m.P],a1=V[m.a[0]],a2=V[m.a[1]],b1=V[m.b[0]],b2=V[m.b[1]],
     av=vsub(a2,a1),bv=vsub(b2,b1),w=vdot(av,bv)<0?vmul(bv,-1):bv,phi=angDeg(av,w),ov;
 ov=[ln(a1,a2,{c:'accent',w:3,lab:nmv(P,m.a),le:'m',lo:[-14,-12]}),ln(b1,b2,{c:'b',w:3,lab:nmv(P,m.b),le:'m',lo:[14,-12]})];
 if(m.tr){
  var e=vadd(Pt,bv),ie=idxOf(P,e),ip=idxOf(P,Pt);
  ov.push(ln(Pt,e,{c:'b',w:2.6,d:1,lab:(ie>=0&&ip>=0)?(P.names[ip]+P.names[ie]):'b′',le:'m',lo:[16,12]}));
 }
 ov.push(ang(Pt,av,w,{r:.34,sq:phi>89.99,lab:fmtN(phi,1)+'°'}));
 if(m.P==='c')ov.push(pt(Pt,'O',{o:[10,12]}));
 P.ov=ov;return P;
}
ITEMS.g3={tag:'§9',
 title:{ru:'Угол между прямыми в кубе',kk:'Кубтағы түзулер арасындағы бұрыш'},
 stmt:{ru:'Чтобы найти угол между скрещивающимися прямыми, одну из них переносят параллельно так, чтобы она пересекла другую, и ищут угол в треугольнике. Для треугольника со сторонами a, b, c угол C находят по теореме косинусов.',
       kk:'Айқас түзулер арасындағы бұрышты табу үшін олардың бірін екіншісін қиятындай етіп параллель көшіріп, үшбұрыштан бұрышты іздейді. a, b, c қабырғалы үшбұрыштың C бұрышы косинус теоремасы арқылы табылады.'},
 sym:{ru:'c² = a² + b² − 2ab·cos C,  cos C = (a² + b² − c²) / 2ab',kk:'c² = a² + b² − 2ab·cos C,  cos C = (a² + b² − c²) / 2ab'},
 real:{ru:'Угол между рёбрами коробки или между балками каркаса находят так же, как в кубе.',kk:'Қораптың қырлары немесе қаңқа арқалықтары арасындағы бұрыш кубтағыдай табылады.'},
 def:'m1',v0:{yaw:-.85,pitch:.42},
 modes:CUBE_MODES.map(function(m){return {id:m.id,ru:m.ru,kk:m.kk,cap:m.cap};}),
 poly:function(){return cubeP();},
 build:function(mm){return [cubeAngle(CUBE_MODES.filter(function(x){return x.id===mm;})[0])];}};

/* ================= tab 2: perpendicular line and plane (§11) ================= */
function rayDir(psi){return [Math.cos(psi*D),0,Math.sin(psi*D)];}
function planeLines(psis,labs){
 return psis.map(function(p,i){var d=rayDir(p);return ln(vmul(d,-1.2),vmul(d,1.2),{c:'c',w:2.2,lab:labs[i],le:'b',lo:[10,-10]});});
}
ITEMS.p1={tag:'§11',

 stmt:{ru:'Прямая называется перпендикулярной плоскости, если она перпендикулярна любой прямой, лежащей в этой плоскости. Перпендикулярная прямая пересекает плоскость.',
       kk:'Егер түзу жазықтықта жатқан кез келген түзуге перпендикуляр болса, ол жазықтыққа перпендикуляр деп аталады. Жазықтыққа перпендикуляр түзу осы жазықтықты қияды.'},
 defs:{ru:['Отрезок называется перпендикулярным плоскости, если он лежит на прямой, перпендикулярной этой плоскости.','Прямая, параллельная плоскости или лежащая в ней, не может быть ей перпендикулярна.'],
       kk:['Кесінді жазықтыққа перпендикуляр түзуде жатса, ол жазықтыққа перпендикуляр кесінді деп аталады.','Жазықтыққа параллель немесе онда жатқан түзу оған перпендикуляр бола алмайды.']},
 sym:{ru:'a ⊥ α  ⇔  a ⊥ b для любой b ⊂ α',kk:'a ⊥ α  ⇔  кез келген b ⊂ α үшін a ⊥ b'},
 real:{ru:'Вертикальный столб, телебашня, монумент «Қазақ елі» стоят перпендикулярно земле.',kk:'Тік тұрған бағана, телемұнара, «Қазақ елі» монументі жерге перпендикуляр тұр.'},
 def:'perp',
 modes:[
  {id:'perp',ru:'Перпендикулярна',kk:'Перпендикуляр',cap:{ru:'Прямая a перпендикулярна каждой прямой b₁, b₂, b₃ плоскости α, проходящей через O: a ⊥ α.',kk:'a түзуі α жазықтығындағы O нүктесі арқылы өтетін әрбір b₁, b₂, b₃ түзуіне перпендикуляр: a ⊥ α.'}},
  {id:'one',ru:'Только одной',kk:'Біреуіне ғана',cap:{ru:'Перпендикулярности одной прямой b₁ мало: a ⊥ b₁, но a наклонена к α и с b₂ образует угол, не равный 90°.',kk:'Бір ғана b₁ түзуіне перпендикулярлық жеткіліксіз: a ⊥ b₁, бірақ a түзуі α-ға көлбеу және b₂-мен 90°-қа тең емес бұрыш жасайды.'}}],
 build:function(m){
  var O=[0,0,0],o=[pl(BIG,'a','α',2)];
  if(m==='perp'){
   o=o.concat(planeLines([0,55,115],['b₁','b₂','b₃']));
   o.push(ln([0,-.45,0],[0,1.25,0],{c:'accent',w:2.8,lab:'a',le:'b',lo:[12,2]}));
   [0,55,115].forEach(function(p){o.push(rightAt(O,[0,1,0],rayDir(p),.2));});
   o.push(pt(O,'O',{o:[-12,14]}));
   return o;
  }
  var t=28*D,dir=[0,Math.cos(t),Math.sin(t)];
  o=o.concat(planeLines([0,70],['b₁','b₂']));
  o.push(ln(vmul(dir,-.5),vmul(dir,1.3),{c:'accent',w:2.8,lab:'a',le:'b',lo:[12,2]}),
   rightAt(O,dir,[1,0,0],.2),ang(O,dir,rayDir(70),{r:.34}),pt(O,'O',{o:[-12,14]}));
  return o;
 }};

ITEMS.p2={tag:'§11',
 title:{ru:'Признак перпендикулярности прямой и плоскости',kk:'Түзу мен жазықтықтың перпендикулярлық белгісі'},

 sym:{ru:'a ⊥ b₁, a ⊥ b₂,  b₁ ∩ b₂ = O,  b₁, b₂ ⊂ β  ⇒  a ⊥ β',kk:'a ⊥ b₁, a ⊥ b₂,  b₁ ∩ b₂ = O,  b₁, b₂ ⊂ β  ⇒  a ⊥ β'},
 real:{ru:'Мачта палатки стоит вертикально, если она перпендикулярна двум лежащим на земле верёвкам.',kk:'Шатырдың діңгегі жерде жатқан екі арқанға перпендикуляр болса, тік тұрады.'},

 modes:[

  {id:'res',ru:'Вывод',kk:'Қорытынды',cap:{ru:'Тогда a перпендикулярна и любой другой прямой b плоскости β, то есть a ⊥ β.',kk:'Онда a түзуі β жазықтығындағы кез келген басқа b түзуіне де перпендикуляр, яғни a ⊥ β.'}}],
 proof:[
  {ru:'Пусть a ⊥ b₁ и a ⊥ b₂, где b₁, b₂ — прямые плоскости β, пересекающиеся в точке O. Возьмём произвольную прямую b ⊂ β и проведём через O прямые a′ ∥ a и b′ ∥ b. Достаточно доказать, что a′ ⊥ b′.',kk:'a ⊥ b₁ және a ⊥ b₂ болсын, мұнда b₁, b₂ — β жазықтығындағы O нүктесінде қиылысатын түзулер. β-дағы кез келген b түзуін алып, O арқылы a′ ∥ a және b′ ∥ b түзулерін жүргіземіз. a′ ⊥ b′ екенін дәлелдеу жеткілікті.'},
  {ru:'В плоскости β проведём прямую, пересекающую b₁, b₂, b′ в точках B₁, B₂, B. На a′ отложим от O равные отрезки OC и OD по разные стороны от O.',kk:'β жазықтығында b₁, b₂, b′ түзулерін B₁, B₂, B нүктелерінде қиятын түзу жүргіземіз. a′ түзуінде O нүктесінен әртүрлі жаққа тең OC және OD кесінділерін саламыз.'},
  {ru:'Прямоугольные треугольники OB₁C и OB₁D равны по катетам, значит, B₁C = B₁D. Аналогично B₂C = B₂D.',kk:'OB₁C және OB₁D тікбұрышты үшбұрыштары катеттері бойынша тең, демек B₁C = B₁D. Дәл солай B₂C = B₂D.'},
  {ru:'Треугольники B₁B₂C и B₁B₂D равны по трём сторонам, поэтому ∠CB₁B = ∠DB₁B.',kk:'B₁B₂C және B₁B₂D үшбұрыштары үш қабырғасы бойынша тең, сондықтан ∠CB₁B = ∠DB₁B.'},
  {ru:'Тогда треугольники B₁BC и B₁BD равны по двум сторонам и углу между ними, значит, BC = BD.',kk:'Онда B₁BC және B₁BD үшбұрыштары екі қабырғасы мен арасындағы бұрышы бойынша тең, демек BC = BD.'},
  {ru:'Треугольники OBC и OBD равны по трём сторонам, поэтому ∠BOC = ∠BOD = 90°, то есть a′ ⊥ b′. Значит, a ⊥ b, и прямая a перпендикулярна плоскости β.',kk:'OBC және OBD үшбұрыштары үш қабырғасы бойынша тең, сондықтан ∠BOC = ∠BOD = 90°, яғни a′ ⊥ b′. Демек, a ⊥ b және a түзуі β жазықтығына перпендикуляр.'}],
 build:function(m){

 real:{ru:'Боковые рёбра прямой призмы перпендикулярны основанию и параллельны друг другу.',kk:'Тік призманың бүйір қырлары табанына перпендикуляр және бір-біріне параллель.'},

 proof:[

  {ru:'По свойству 2 эта прямая перпендикулярна β.',kk:'2-қасиет бойынша бұл түзу β-ға перпендикуляр.'},

 build:function(m){

   return o;

  return o;
 }};

ITEMS.o1={tag:'§12, §15',

 sym:{ru:'AH ⊥ α;  AM — наклонная;  HM — проекция;  ρ(A, α) = AH',kk:'AH ⊥ α;  AM — көлбеу;  HM — проекция;  ρ(A, α) = AH'},
 real:{ru:'Лампочка уличного фонаря на высоте 6 м: расстояние до земли измеряют по перпендикуляру.',kk:'Көше шамы 6 м биіктікте: жерге дейінгі қашықтық перпендикуляр бойынша өлшенеді.'},
 def:'one',
 modes:[{id:'one',ru:'Наклонная',kk:'Көлбеу',cap:null}],
 slider:{min:0,max:40,def:20,sym:'HM',unit:'',fmt:dec1},
 dyn:function(v,L){
  var r=v.n/10,am=Math.sqrt(9+r*r);
  if(v.n===0)return L==='ru'?'Точка M совпала с H: наклонной нет, AM = AH = 3.':'M нүктесі H-пен беттесті: көлбеу жоқ, AM = AH = 3.';
  return L==='ru'?('AH = 3, HM = '+fmtN(r,1)+' ⇒ AM² = 9 + '+fmtN(r*r,2)+' = '+fmtN(9+r*r,2)+', AM ≈ '+fmtN(am,2)+'. Наклонная длиннее перпендикуляра.'):
   ('AH = 3, HM = '+fmtN(r,1)+' ⇒ AM² = 9 + '+fmtN(r*r,2)+' = '+fmtN(9+r*r,2)+', AM ≈ '+fmtN(am,2)+'. Көлбеу перпендикулярдан ұзын.');
 },
 build:function(m,v){
  var H=[-.5,0,.1],A=vadd(H,[0,.95,0]),r=v.n/10*KS,M=vadd(H,[r,0,0]),o=[pl(BIG,'a','α',2)];
  o.push(ln(A,H,{c:'accent',w:2.8}),pt(A,'A',{o:[-12,-6]}),pt(H,'H',{o:[-12,12]}));
  if(v.n>0){
   o.push(ln(A,M,{c:'b',w:2.8}),ln(H,M,{c:'c',w:2.8}),pt(M,'M',{o:[12,12]}),
    rightAt(H,[0,1,0],[1,0,0],.17),ang(M,vsub(A,M),vsub(H,M),{r:.3,lab:'φ'}));
  }
  return o;
 }};

 sym:{ru:'AM² = AH² + HM²;   HM₁ = HM₂ ⇔ AM₁ = AM₂;   HM₁ > HM₂ ⇔ AM₁ > AM₂',kk:'AM² = AH² + HM²;   HM₁ = HM₂ ⇔ AM₁ = AM₂;   HM₁ > HM₂ ⇔ AM₁ > AM₂'},

 proof:[
  {ru:'В прямоугольном треугольнике AHM по теореме Пифагора AM² = AH² + HM² для любой наклонной.',kk:'Тікбұрышты AHM үшбұрышында Пифагор теоремасы бойынша кез келген көлбеу үшін AM² = AH² + HM².'},
  {ru:'Так как HM > 0, то AM > AH: перпендикуляр короче любой наклонной.',kk:'HM > 0 болғандықтан AM > AH: перпендикуляр кез келген көлбеуден қысқа.'},
  {ru:'Для двух наклонных AH общий, поэтому AM₁ = AM₂ тогда и только тогда, когда HM₁ = HM₂.',kk:'Екі көлбеу үшін AH ортақ, сондықтан AM₁ = AM₂ тек HM₁ = HM₂ болғанда ғана орындалады.'},
  {ru:'Аналогично AM₁ > AM₂ тогда и только тогда, когда HM₁ > HM₂.',kk:'Дәл солай AM₁ > AM₂ тек HM₁ > HM₂ болғанда ғана орындалады.'}],
 def:'one',
 modes:[{id:'one',ru:'Две наклонные',kk:'Екі көлбеу',cap:null}],

   ('HM₁ = 2, AM₁ ≈ '+fmtN(a1,2)+'.  HM₂ = '+fmtN(r2,1)+', AM₂ ≈ '+fmtN(a2,2)+'.  HM₂ '+rel+' HM₁ ⇒ AM₂ '+rel+' AM₁.');

ITEMS.o3={tag:'§15',
 title:{ru:'Ортогональная проекция',kk:'Ортогональ проекция'},
 stmt:{ru:'Ортогональная проекция точки A на плоскость — основание A′ перпендикуляра AA′. Ортогональное проектирование переводит прямые, не перпендикулярные плоскости, в прямые, а прямые, перпендикулярные плоскости, — в точки. Оно сохраняет отношение отрезков, лежащих на одной прямой.',
       kk:'A нүктесінің жазықтыққа ортогональ проекциясы — AA′ перпендикулярының A′ табаны. Ортогональ проекциялау жазықтыққа перпендикуляр емес түзулерді түзуге, ал жазықтыққа перпендикуляр түзулерді нүктеге түрлендіреді. Ол бір түзуде жатқан кесінділердің қатынасын сақтайды.'},
 sym:{ru:'AA′ ⊥ π;  c′ — проекция c;  AC : CB = A′C′ : C′B′',kk:'AA′ ⊥ π;  c′ — c-ның проекциясы;  AC : CB = A′C′ : C′B′'},
 real:{ru:'Тень от предмета при вертикальных лучах Солнца — его ортогональная проекция на землю.',kk:'Күн сәулесі тік түскендегі заттың көлеңкесі — оның жерге ортогональ проекциясы.'},
 proof:[
  {ru:'Свойство 2. Пусть точки A, B, C лежат на прямой c, не перпендикулярной плоскости π, а A′, B′, C′ — их проекции.',kk:'2-қасиет. A, B, C нүктелері π жазықтығына перпендикуляр емес c түзуінде жатсын, ал A′, B′, C′ — олардың проекциялары.'},
  {ru:'Прямые AA′, BB′, CC′ перпендикулярны π, поэтому параллельны между собой (свойство 3).',kk:'AA′, BB′, CC′ түзулері π-ге перпендикуляр, сондықтан өзара параллель (3-қасиет).'},
  {ru:'По теореме о пропорциональных отрезках AC : CB = A′C′ : C′B′.',kk:'Пропорционал кесінділер туралы теорема бойынша AC : CB = A′C′ : C′B′.'}],
 def:'line',
 modes:[
  {id:'line',ru:'Прямая c',kk:'c түзуі',cap:{ru:'Прямая c не перпендикулярна плоскости π, её проекция — прямая c′. Параллельные AA′, CC′, BB′ делят c и c′ в одном отношении.',kk:'c түзуі π жазықтығына перпендикуляр емес, оның проекциясы — c′ түзуі. Параллель AA′, CC′, BB′ түзулері c және c′ түзулерін бірдей қатынаста бөледі.'}},
  {id:'point',ru:'c ⊥ π',kk:'c ⊥ π',cap:{ru:'Если прямая перпендикулярна плоскости, её ортогональная проекция — точка.',kk:'Түзу жазықтыққа перпендикуляр болса, оның ортогональ проекциясы — нүкте.'}}],
 build:function(m){
  var o=[pl(BIG,'a','π',2)];
  if(m==='point'){
   var B0=[.1,0,.1];
   o.push(ln(vadd(B0,[0,-.3,0]),vadd(B0,[0,1.25,0]),{c:'accent',w:2.8,lab:'c',le:'b',lo:[12,2]}),
    pt(vadd(B0,[0,1.0,0]),'A',{o:[-12,-4]}),pt(vadd(B0,[0,.45,0]),'B',{o:[-12,-4]}),pt(B0,'A′ = B′',{o:[-30,14]}),rightAt(B0,[0,1,0],[1,0,0],.17));
   return o;
  }
  var P0=[-.9,.8,-.35],P1=[.9,.1,.45];
  function at(t){return lerp(P0,P1,t);}
  function dn(p){return [p[0],0,p[2]];}
  var A=at(.05),C=at(.42),B=at(.95);
  o.push(ln(lerp(P0,P1,-.1),lerp(P0,P1,1.1),{c:'accent',w:2.8,lab:'c',le:'a',lo:[-10,-8]}),
   ln(dn(lerp(P0,P1,-.1)),dn(lerp(P0,P1,1.1)),{c:'c',w:2.6,lab:'c′',le:'b',lo:[14,10]}));
  [A,C,B].forEach(function(p,i){
   o.push(dashed(p,dn(p)),pt(p,['A','C','B'][i],{o:[-12,-6]}),pt(dn(p),['A′','C′','B′'][i],{o:[-4,16]}));
  });
  return o;
 }};

 sym:{ru:'AA′ ⊥ π;  b ⊂ π;  b ⊥ A′B  ⇒  b ⊥ AB',kk:'AA′ ⊥ π;  b ⊂ π;  b ⊥ A′B  ⇒  b ⊥ AB'},
 extra:{ru:'Пример из учебника: в кубе ABCDA₁B₁C₁D₁ проекция BD₁ на плоскость ABC — это BD, и AC ⊥ BD, значит, AC ⊥ BD₁.',kk:'Оқулықтағы мысал: ABCDA₁B₁C₁D₁ кубында BD₁-дің ABC жазықтығына проекциясы — BD, ал AC ⊥ BD, демек AC ⊥ BD₁.'},
 real:{ru:'Наклонная стойка и её тень на полу: линия на полу, перпендикулярная тени, перпендикулярна и стойке.',kk:'Көлбеу тіреу және оның еденге түскен көлеңкесі: еденде көлеңкеге перпендикуляр сызық тіреуге де перпендикуляр.'},
 proof:[
  {ru:'Пусть AA′ — перпендикуляр к π, AB — наклонная, A′B — её проекция, прямая b ⊂ π перпендикулярна A′B.',kk:'AA′ — π-ге перпендикуляр, AB — көлбеу, A′B — оның проекциясы, ал π-дегі b түзуі A′B-ға перпендикуляр болсын.'},
  {ru:'Так как AA′ ⊥ π, то AA′ перпендикулярна любой прямой плоскости, в частности b.',kk:'AA′ ⊥ π болғандықтан, AA′ жазықтықтағы кез келген түзуге, атап айтқанда b-ға перпендикуляр.'},
  {ru:'Прямая b перпендикулярна двум пересекающимся прямым AA′ и A′B плоскости AA′B, значит, b ⊥ плоскости AA′B.',kk:'b түзуі AA′B жазықтығындағы қиылысатын AA′ және A′B түзулеріне перпендикуляр, демек b ⊥ AA′B жазықтығы.',ref:['p2']},
  {ru:'Наклонная AB лежит в плоскости AA′B, поэтому b ⊥ AB.',kk:'AB көлбеуі AA′B жазықтығында жатыр, сондықтан b ⊥ AB.'}],
 def:'setup',
 modes:[
  {id:'setup',ru:'Дано',kk:'Берілгені',cap:{ru:'AA′ ⊥ π, AB — наклонная, A′B — её проекция. В плоскости π через B проходит прямая b.',kk:'AA′ ⊥ π, AB — көлбеу, A′B — оның проекциясы. π жазықтығында B нүктесі арқылы b түзуі өтеді.'}},
  {id:'given',ru:'b ⊥ A′B',kk:'b ⊥ A′B',cap:{ru:'Пусть b перпендикулярна проекции A′B.',kk:'b түзуі A′B проекциясына перпендикуляр болсын.'}},
  {id:'res',ru:'b ⊥ AB',kk:'b ⊥ AB',cap:{ru:'Тогда b перпендикулярна и наклонной AB.',kk:'Онда b түзуі AB көлбеуіне де перпендикуляр.'}}],
 build:function(m){
  var Ap=[-.3,0,.15],A=vadd(Ap,[0,.95,0]),B=[.6,0,.5],pb=vsub(B,Ap),bd=vunit([-pb[2],0,pb[0]]),
      o=[pl(BIG,'a','π',2),ln(A,Ap,{c:'accent',w:2.6}),ln(A,B,{c:'b',w:2.8}),ln(Ap,B,{c:'c',w:2.8}),
         pt(A,'A',{o:[-12,-6]}),pt(Ap,'A′',{o:[-14,12]}),pt(B,'B',{o:[14,10]}),rightAt(Ap,[0,1,0],pb,.17)];
  o.push(ln(vadd(B,vmul(bd,-1.0)),vadd(B,vmul(bd,1.0)),{c:'ink',w:2.4,lab:'b',le:'b',lo:[12,-8]}));
  if(m==='given')o.push(rightAt(B,bd,vsub(Ap,B),.17));
  if(m==='res')o.push(rightAt(B,bd,vsub(Ap,B),.17),rightAt(B,bd,vsub(A,B),.24));

ITEMS.l1={tag:'§16',
 title:{ru:'Угол между прямой и плоскостью',kk:'Түзу мен жазықтық арасындағы бұрыш'},
 stmt:{ru:'Углом между наклонной и плоскостью называется угол между этой наклонной и её ортогональной проекцией на плоскость. Прямая, перпендикулярная плоскости, образует с ней прямой угол. Углом между отрезком и плоскостью называется угол между прямой, содержащей отрезок, и этой плоскостью.',
       kk:'Көлбеу мен жазықтық арасындағы бұрыш деп осы көлбеу мен оның жазықтыққа ортогональ проекциясы арасындағы бұрышты айтады. Жазықтыққа перпендикуляр түзу онымен тік бұрыш жасайды. Кесінді мен жазықтық арасындағы бұрыш деп кесіндіні қамтитын түзу мен осы жазықтық арасындағы бұрышты айтады.'},
 defs:{ru:['Перпендикулярная прямая образует с плоскостью угол 90°.','Параллельная плоскости прямая образует с ней угол 0°.'],
       kk:['Перпендикуляр түзу жазықтықпен 90° бұрыш жасайды.','Жазықтыққа параллель түзу онымен 0° бұрыш жасайды.']},
 sym:{ru:'φ = ∠(a, α) = ∠ACA′,  0° ≤ φ ≤ 90°;  sin φ = AA′ : AC',kk:'φ = ∠(a, α) = ∠ACA′,  0° ≤ φ ≤ 90°;  sin φ = AA′ : AC'},
 real:{ru:'Наклон лестницы к земле, склона горы к горизонту, взлёт самолёта.',kk:'Сатының жерге еңкеюі, тау баурайының көкжиекке еңкеюі, ұшақтың көтерілуі.'},
 def:'one',
 modes:[{id:'one',ru:'Угол',kk:'Бұрыш',cap:null}],
 slider:{min:0,max:90,def:40,sym:'φ',unit:'°'},
 dyn:function(v,L){
  var f=v.n;
  if(f===0)return L==='ru'?'Прямая параллельна плоскости (или лежит в ней): угол равен 0°.':'Түзу жазықтыққа параллель (немесе онда жатыр): бұрыш 0°.';
  if(f===90)return L==='ru'?'Прямая перпендикулярна плоскости: угол равен 90°, проекция прямой — точка.':'Түзу жазықтыққа перпендикуляр: бұрыш 90°, түзудің проекциясы — нүкте.';
  return L==='ru'?('CA — наклонная, CA′ — её проекция, AA′ ⊥ α. Угол ACA′ = '+f+'°, sin φ = AA′ : AC ≈ '+fmtN(Math.sin(f*D),2)+'.'):
   ('CA — көлбеу, CA′ — оның проекциясы, AA′ ⊥ α. ACA′ бұрышы = '+f+'°, sin φ = AA′ : AC ≈ '+fmtN(Math.sin(f*D),2)+'.');
 },
 build:function(m,v){
  var f=v.n*D,C=[-.35,0,0],d=[Math.cos(f),Math.sin(f),0],A=vadd(C,vmul(d,1.15)),Ap=[A[0],0,0],o=[pl(BIG,'a','α',2)];
  if(v.n>0)o.push(ln(vadd(C,vmul(d,-.5)),C,{c:'faint',w:1.8,d:1}));
  o.push(ln(C,vadd(C,vmul(d,1.3)),{c:'accent',w:2.8,lab:'a',le:'b',lo:[12,-4]}));
  if(v.n>0&&v.n<90)o.push(ln(C,Ap,{c:'c',w:2.8}),dashed(A,Ap),rightAt(Ap,[0,1,0],[-1,0,0],.17),pt(Ap,'A′',{o:[4,16]}));
  if(v.n===90)o.push(rightAt(C,d,[1,0,0],.2));
  else if(v.n>0)o.push(ang(C,d,[1,0,0],{r:.42,lab:'φ'}));
  o.push(pt(C,'C',{o:[-12,14]}),pt(A,'A',{o:[-12,-6]}));
  return o;
 }};

ITEMS.l2={tag:'§16',
 title:{ru:'Наименьший из углов',kk:'Бұрыштардың ең кішісі'},
 stmt:{ru:'Угол между наклонной и плоскостью — наименьший из углов, которые эта наклонная образует с прямыми плоскости, проходящими через точку её пересечения с плоскостью.',
       kk:'Көлбеу мен жазықтық арасындағы бұрыш — осы көлбеудің жазықтықтың оны қиятын нүктесі арқылы өтетін түзулерімен жасайтын бұрыштарының ең кішісі.'},

function cubeLine(m){
 var P=cubeP(),V=P.V,p0=V[m.pl[0]],n=vunit(vcross(vsub(V[m.pl[1]],p0),vsub(V[m.pl[2]],p0))),d0=vdot(n,p0),
     A=V[m.ln[0]],B=V[m.ln[1]],sa=vdot(n,A)-d0,sb=vdot(n,B)-d0,X,Y,t;
 if(Math.abs(sa)<1e-9){X=A;Y=B;}else if(Math.abs(sb)<1e-9){X=B;Y=A;}
 else{t=sa/(sa-sb);X=lerp(A,B,t);Y=Math.abs(sa)>=Math.abs(sb)?A:B;}
 var sY=vdot(n,Y)-d0,Yp=vsub(Y,vmul(n,sY)),phi=Math.asin(Math.min(1,Math.abs(vdot(n,vunit(vsub(B,A))))))/D,
     ov=[pl(m.pl.map(function(i){return V[i];}),'c',null,0),ln(A,B,{c:'accent',w:3,lab:nmv(P,m.ln),le:'m',lt:.3,lo:[-18,-12]})];
 if(vlen(vsub(Yp,X))>1e-6){
  ov.push(ln(X,Yp,{c:'c',w:2.8}),dashed(Y,Yp),ang(X,vsub(Y,X),vsub(Yp,X),{r:.34,lab:fmtN(phi,1)+'°'}));
 }else{
  ov.push(ang(X,vsub(Y,X),vsub(V[m.pl[1]],V[m.pl[0]]),{r:.22,sq:true,lab:'90°'}));
 }
 P.ov=ov;return P;
}

function pyrEq(n){
 var a=1.35,R=a/(2*Math.sin(Math.PI/n)),h=Math.sqrt(a*a-R*R),base=ngon(n,R,-h/2,Math.PI*.75),F=[[]],names=[],i,j;
 for(i=0;i<n;i++){F[0].push(i);names.push(LET[i]);}
 for(i=0;i<n;i++){j=(i+1)%n;F.push([i,j,n]);}
 names.push('S');
 var P=poly(base.concat([[0,h/2,0]]),F,names),O=[0,-h/2,0],S=[0,h/2,0],A=base[0];
 P.ov=[dashed(S,O,'c'),dashed(O,A,'c'),pt(O,'O',{o:[10,12]}),ang(A,vsub(S,A),vsub(O,A),{r:.3,lab:'φ'}),rightAt(O,vsub(S,O),vsub(A,O),.14)];
 P.phi=Math.acos(R/a)/D;return P;
}

/* ---------- 3D rendering ---------- */
var S=108,CX=210,CY=150;
function proj(p,v){
 var cy=Math.cos(v.yaw),sy=Math.sin(v.yaw),cp=Math.cos(v.pitch),sp=Math.sin(v.pitch);
 var x1=p[0]*cy+p[2]*sy,z1=-p[0]*sy+p[2]*cy;
 var y2=p[1]*cp-z1*sp,z2=p[1]*sp+z1*cp;
 return {x:CX+x1*S,y:CY-y2*S,z:z2};
}
function f1(n){return n.toFixed(1);}
function polySVG(p,v){
 var cy=Math.cos(v.yaw),sy=Math.sin(v.yaw),cp=Math.cos(v.pitch),sp=Math.sin(v.pitch),i,R,c=[0,0,0];
 R=p.V.map(function(q){var x1=q[0]*cy+q[2]*sy,z1=-q[0]*sy+q[2]*cy;return [x1,q[1]*cp-z1*sp,q[1]*sp+z1*cp];});
 R.forEach(function(r){c[0]+=r[0];c[1]+=r[1];c[2]+=r[2];});
 c=c.map(function(x){return x/R.length;});
 var front=p.F.map(function(f){
  var a=R[f[0]],b=R[f[1]],d=R[f[2]],u=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],w=[d[0]-a[0],d[1]-a[1],d[2]-a[2]];
  var n=[u[1]*w[2]-u[2]*w[1],u[2]*w[0]-u[0]*w[2],u[0]*w[1]-u[1]*w[0]],fc=[0,0,0];
  f.forEach(function(k){fc[0]+=R[k][0];fc[1]+=R[k][1];fc[2]+=R[k][2];});
  fc=fc.map(function(x){return x/f.length;});
  if(n[0]*(fc[0]-c[0])+n[1]*(fc[1]-c[1])+n[2]*(fc[2]-c[2])<0)n=[-n[0],-n[1],-n[2]];
  return n[2]>1e-6;
 });
 var sc=R.map(function(r){return {x:CX+r[0]*S,y:CY-r[1]*S};});
 var edges={},vis=R.map(function(){return false;});
 p.F.forEach(function(f,fi){
  for(i=0;i<f.length;i++){
   var a=f[i],b=f[(i+1)%f.length],k=a<b?a+'-'+b:b+'-'+a;
   if(!edges[k])edges[k]={a:a,b:b,vis:false};
   if(front[fi]){edges[k].vis=true;vis[a]=true;vis[b]=true;}
  }
 });
 var hid='',shown='',fills='',labels='',k,e;
 for(k in edges){
  e=edges[k];
  var seg='<line x1="'+f1(sc[e.a].x)+'" y1="'+f1(sc[e.a].y)+'" x2="'+f1(sc[e.b].x)+'" y2="'+f1(sc[e.b].y)+'"';
  if(e.vis)shown+=seg+' class="ln ln-ink" stroke-width="2"/>';

 ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);
 for(var i=1;i<p.length-1;i++){ctx.quadraticCurveTo(p[i][0],p[i][1],(p[i][0]+p[i+1][0])/2,(p[i][1]+p[i+1][1])/2);}

function eraseAt(e){
 var r=ink.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,R=15,n=strokes.length;
 for(var i=strokes.length-1;i>=0;i--){
  if(strokes[i].p.some(function(a){var dx=a[0]*r.width-x,dy=a[1]-y;return dx*dx+dy*dy<R*R;}))strokes.splice(i,1);
 }
 if(strokes.length!==n)drawAll();

  cur={c:pen.color,w:SIZES[pen.size],p:[pos(e)]};strokes.push(cur);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var q=cur.p[0];setLine(cur);ctx.beginPath();ctx.arc(q[0]*ink.clientWidth,q[1],cur.w/2,0,6.2832);ctx.fill();
 }else{erasing=true;eraseAt(e);}

ink.addEventListener('pointermove',function(e){

  var p=pos(e),l=cur.p[cur.p.length-1],w=ink.clientWidth,dx=(p[0]-l[0])*w,dy=p[1]-l[1];
  if(dx*dx+dy*dy<2.25)return;

  ctx.beginPath();ctx.moveTo(l[0]*w,l[1]);ctx.lineTo(p[0]*w,p[1]);ctx.stroke();
 }else if(erasing){eraseAt(e);}
});

}
document.addEventListener('click',function(e){
 var el=e.target.closest('button');if(!el)return;
 var t=T[state.lang];
 if(el.dataset.lang){
  state.lang=el.dataset.lang;savePrefs();fullRender();return;
 }
 if(el.dataset.size!==undefined&&el.closest('#sizeSeg')){state.size=+el.dataset.size;savePrefs();applySize();requestAnimationFrame(function(){sizeInk();drawAll();});return;}
 if(el.dataset.tool){setTool(el.dataset.tool);return;}
 if(el.dataset.color){pen.color=el.dataset.color;pen.tool='pen';renderPen();return;}
 var act=el.dataset.act;if(!act)return;
 if(act==='theme'){state.theme=state.theme==='dark'?'light':'dark';savePrefs();renderTheme();requestAnimationFrame(drawAll);}
 else if(act==='tab'){state.tab=el.dataset.tab;savePrefs();fullRender();window.scrollTo(0,0);}
 else if(act==='mode'){
  var v=view(el.dataset.id),nm=el.dataset.mode;
  if(nm==='net'){v.yaw=0;v.pitch=Math.PI/2;}
  else if(v.mode==='net'){v.yaw=-.55;v.pitch=.5;}
  v.mode=nm;
  $$('[data-act="mode"][data-id="'+el.dataset.id+'"]').forEach(function(b){b.setAttribute('aria-pressed',String(b===el));});
  drawFig(el.dataset.id);
 }
 else if(act==='reset'){var v2=view(el.dataset.id);var it0=ITEMS[el.dataset.id];v2.yaw=it0.v0?it0.v0.yaw:-.55;v2.pitch=it0.v0?it0.v0.pitch:.5;drawFig(el.dataset.id);}
 else if(act==='rgroup'){
  state.ref.g=el.dataset.g;
  $$('[data-act="rgroup"]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.g===state.ref.g));});
  $('#refGrid').innerHTML=refGridHTML();requestAnimationFrame(sizeInk);
 }
 else if(act==='copy'){copySym(el.dataset.sym);}
 else if(act==='qpick'){
  var q=state.quiz;if(q.sel!==null)return;
  q.sel=+el.dataset.i;if(q.sel===QUIZ[q.i].a)q.score++;renderView();sizeInk();
 }
 else if(act==='qnext'){
  var qq=state.quiz;
  if(qq.i===QUIZ.length-1)qq.done=true;else{qq.i++;qq.sel=null;}
  renderView();sizeInk();
 }
 else if(act==='qrestart'){state.quiz={i:0,sel:null,score:0,done:false};renderView();sizeInk();}
 else if(act==='size'){pen.size=(pen.size+1)%SIZES.length;renderPen();}
 else if(act==='undo'){strokes.pop();drawAll();saveInk();}
 else if(act==='clear'){
  if(pen.armed){strokes.length=0;drawAll();saveInk();pen.armed=false;clearTimeout(armTimer);renderPen();toast(t.cleared);}
  else{pen.armed=true;renderPen();toast(t.clearArmed);clearTimeout(armTimer);armTimer=setTimeout(function(){pen.armed=false;renderPen();},3000);}
 }
});
document.addEventListener('input',function(e){
 var el=e.target;
 if(el.id==='refq'){state.ref.q=el.value;$('#refGrid').innerHTML=refGridHTML();requestAnimationFrame(sizeInk);}
 else if(el.type==='range'&&el.dataset.id){
  var v=view(el.dataset.id);v.n=+el.value;
  var nv=$('#nv-'+el.dataset.id);if(nv){var sl=ITEMS[el.dataset.id].slider;nv.textContent=sl&&sl.fmt?sl.fmt(v.n):v.n;}
  drawFig(el.dataset.id);
 }
});

/* drag to rotate figures */
var drag=null;
document.addEventListener('pointerdown',function(e){
 var s=e.target.closest&&e.target.closest('svg[data-fig]');if(!s)return;
 drag={id:s.dataset.fig,x:e.clientX,y:e.clientY,pid:e.pointerId,svg:s};
 try{s.setPointerCapture(e.pointerId);}catch(x){}
 s.classList.add('grab');
});
document.addEventListener('pointermove',function(e){
 if(!drag||e.pointerId!==drag.pid)return;
 var v=view(drag.id),dx=e.clientX-drag.x,dy=e.clientY-drag.y;
 drag.x=e.clientX;drag.y=e.clientY;
 v.yaw+=dx*.011;
 if(e.pointerType==='mouse')v.pitch=Math.max(-.25,Math.min(Math.PI/2,v.pitch+dy*.01));
 drawFig(drag.id);
});
function endDrag(e){if(drag&&e.pointerId===drag.pid){drag.svg.classList.remove('grab');drag=null;}}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);
document.addEventListener('keydown',function(e){
 var s=e.target.closest&&e.target.closest('svg[data-fig]');if(!s)return;
 var v=view(s.dataset.fig),k=e.key,h=true;
 if(k==='ArrowLeft')v.yaw-=.12;else if(k==='ArrowRight')v.yaw+=.12;
 else if(k==='ArrowUp')v.pitch=Math.min(Math.PI/2,v.pitch+.08);else if(k==='ArrowDown')v.pitch=Math.max(-.25,v.pitch-.08);
 else h=false;
 if(h){e.preventDefault();drawFig(s.dataset.fig);}
});

/* ---------- boot ---------- */
function fullRender(){
 var L=state.lang,t=T[L];
 document.documentElement.lang=L==='kk'?'kk':'ru';
 $('#bt').textContent=t.title;$('#bs').textContent=t.sub;
 $$('.seg button[data-lang]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.lang===L));});
 applySize();
 renderTabs();renderTheme();loadStrokes();renderView();renderPen();
 requestAnimationFrame(sizeInk);
}
fullRender();
if(window.ResizeObserver)new ResizeObserver(function(){sizeInk();}).observe($('#view'));
window.addEventListener('resize',sizeInk);
})();
</script>

</body></html>
